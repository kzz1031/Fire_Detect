# Swin Transformer Model Configuration
model:
  name: "swin_base"  # swin_tiny, swin_small, swin_base
  num_classes: 3
  pretrained: false
  image_size: 224
  drop_rate: 0.1  # Dropout比率
  drop_path_rate: 0.1  # Drop path regularization

data:
  root_dir: "data"
  train_split: 0.8
  val_split: 0.2
  test_split: 0
  batch_size: 64
  num_workers: 4
  augmentation:
    enabled: true
    use_vit_transforms: true  # 使用ViT/Swin专用的数据增强
    resize_strategy: "crop"  # 保持长宽比+crop
    resize_scale: 1.1
    horizontal_flip: 0.5
    color_jitter: true
    color_jitter_params:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.4
      hue: 0.2
      p: 0.8
    random_brightness_contrast: true
    brightness_limit: 0.3
    contrast_limit: 0.3
    brightness_contrast_p: 0.7
    rgb_shift: true
    rgb_shift_limit: 20
    rgb_shift_p: 0.5
    rotate: true
    rotate_limit: 15
    rotate_p: 0.5
    shift_scale_rotate: true
    shift_limit: 0.1
    scale_limit: 0.1
    shift_scale_rotate_p: 0.5
    gaussian_noise: true
    noise_var_limit: [10.0, 50.0]
    noise_p: 0.3
    gaussian_blur: true
    blur_limit: [3, 7]
    blur_p: 0.3
    cutout: true
    max_holes: 8
    max_height: 32
    max_width: 32
    cutout_p: 0.3
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 10
  save_interval: 5
  use_focal_loss: False
  focal_loss_alpha: 1.0
  focal_loss_gamma: 2.0
  use_class_weights: false
  label_smoothing: 0.1

paths:
  checkpoint_dir: "checkpoints/swin/default"
  log_dir: "logs/swin/default"
  result_dir: "results/swin/default"

wandb:
  enabled: true
  project: "fire_detection_swin"
  name: null

