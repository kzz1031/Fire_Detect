# Swin Transformer 消融实验配置
# 可以在这里定义自定义的消融实验

# 基础配置会从 configs/swin/config.yaml 加载
# 每个实验只需要定义需要修改的参数

experiments:
  # 模型大小消融
  - name: "swin_tiny"
    model:
      name: "swin_tiny"
  
  - name: "swin_small"
    model:
      name: "swin_small"
  
  - name: "swin_base"
    model:
      name: "swin_base"
  
  # 学习率消融
  - name: "lr_5e-5"
    training:
      learning_rate: 5e-5
  
  - name: "lr_1e-4"
    training:
      learning_rate: 1e-4
  
  - name: "lr_2e-4"
    training:
      learning_rate: 2e-4
  
  # Dropout消融
  - name: "dropout_0.0"
    model:
      drop_rate: 0.0
      drop_path_rate: 0.0
  
  - name: "dropout_0.1"
    model:
      drop_rate: 0.1
      drop_path_rate: 0.1
  
  - name: "dropout_0.2"
    model:
      drop_rate: 0.2
      drop_path_rate: 0.2
  
  # Batch size消融
  - name: "bs_32"
    data:
      batch_size: 32
  
  - name: "bs_64"
    data:
      batch_size: 64
  
  - name: "bs_128"
    data:
      batch_size: 128
  
  # 损失函数消融
  - name: "focal_loss"
    training:
      use_focal_loss: true
      focal_loss_alpha: 1.0
      focal_loss_gamma: 2.0
  
  - name: "class_weights"
    training:
      use_class_weights: true
  
  # 组合实验示例
  - name: "swin_small_lr_1e-4_dropout_0.1"
    model:
      name: "swin_small"
      drop_rate: 0.1
      drop_path_rate: 0.1
    training:
      learning_rate: 1e-4


