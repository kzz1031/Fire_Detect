# Qwen VLM Model Configuration
# Available models:
# - "Qwen/Qwen-VL" (original, ~7B params, based on Qwen-7B)
# - "Qwen/Qwen-VL-Chat" (chat version, ~7B params)
# - "Qwen/Qwen2-VL-2B-Instruct" (2B version)
# - "Qwen/Qwen2-VL-7B-Instruct" (7B version, newer)
# - "Qwen/Qwen2-VL-72B-Instruct" (72B version)
model_name: "Qwen/Qwen-VL"  # Default: ~7B params
num_classes: 3
max_length: 512
image_size: 448
freeze_vision_encoder: false
freeze_language_model: false

# Classification head
hidden_size: 1024
dropout: 0.1

# PEFT (Parameter-Efficient Fine-Tuning) settings
use_peft: true
peft_type: "lora"  # or "qlora"
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

