# Fire Detection Dataset Configuration
root_dir: "data"
databases:
  - "FIRE_DATABASE_1"
  - "FIRE_DATABASE_2"
  - "FIRE_DATABASE_3"

classes:
  - "fire"
  - "start_fire"
  - "no_fire"

train_split: 0.8
val_split: 0.1
test_split: 0.1

batch_size: 4
num_workers: 4
pin_memory: true

# Data augmentation
augmentation:
  enabled: true
  resize: 448
  random_crop: true
  horizontal_flip: 0.5
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

